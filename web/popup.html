<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.45 -apple-system, "Segoe UI", sans-serif; width: 340px; margin: 0; padding: 12px; }
    h1 { font: 600 13px -apple-system, sans-serif; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 10px; font-size: 12px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 4px; cursor: pointer;
             background: #fc0; color: #000; font-weight: 600; }
    button:disabled { background: #ddd; color: #888; cursor: wait; }
    #msg { white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; background: #f5f5f5; padding: 8px;
           border-radius: 4px; max-height: 220px; overflow: auto; }
    #out { box-sizing: border-box; width: 100%; min-height: 150px; font: 11px/1.4 ui-monospace, monospace;
           margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Scan current Yandex Music tab</h1>
  <p>Open this popup while your logged-in music.yandex.ru tab shows a playlist or album. Reads rendered rows
     (DOM only, no API/token → can never WAF-403, rule-honest). Copies track JSON to clipboard.</p>
  <button id="scan">Scan tab → copy JSON</button>
  <div id="msg">idle — open a playlist or album first.</div>
  <textarea id="out" rows="8" readonly placeholder="track JSON appears here, then copies to clipboard."></textarea>
  <script src="popup.js"></script>
</body>
</html>
