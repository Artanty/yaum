name: Deploy web to Surge

# This file lives in web/.github/ on purpose: GitHub only runs workflows from the
# repo-root .github/workflows, so it executes in the "slave" repo that receives
# web/ at its root. At run time the checkout IS the contents of web/, which is
# why the publish target below is "." (the repo root).
on:
  push:
    branches: [main]

# Nothing is pushed back (no domain is committed), so read-only is enough.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish to Surge
    # The surge CLI is known to stall after a successful upload on some
    # networks; a hard cap keeps a hang from burning the 6h default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The domain is required: no SURGE_DOMAIN -> fail, no deploy.
      - name: Resolve SURGE_DOMAIN from .env
        run: |
          # Read KEY=value out of the root .env without ever echoing a value.
          env_get() {
            [ -f .env ] || { printf ''; return 0; }
            grep -E "^$1=" .env | head -1 | cut -d '=' -f2- | tr -d '\r' || true
          }

          SURGE_DOMAIN="$(env_get SURGE_DOMAIN | tr -d '[:space:]\"')"

          if [ -z "$SURGE_DOMAIN" ]; then
            echo "::error title=Surge deploy failed::SURGE_DOMAIN is missing/empty in .env; refusing to deploy."
            if [ -f .env ]; then
              echo ".env is present; key names: $(grep -oE '^[A-Za-z_]+' .env | sort -u | tr '\n' ' ')"
            else
              echo ".env is NOT in the checkout."
            fi
            exit 1
          fi

          echo "SURGE_DOMAIN=$SURGE_DOMAIN" >> "$GITHUB_ENV"
          echo "SURGE_DOMAIN is set -> will publish the repo root to $SURGE_DOMAIN"

      - name: Write the CNAME file
        run: |
          printf '%s\n' "$SURGE_DOMAIN" > CNAME
          echo "CNAME written: $(cat CNAME)"

      - name: Install surge
        run: npm install -g surge

      - name: Publish the repo root to Surge
        run: |
          env_get() {
            [ -f .env ] || { printf ''; return 0; }
            grep -E "^$1=" .env | head -1 | cut -d '=' -f2- | tr -d '\r' || true
          }

          SURGE_TOKEN="$(env_get SURGE_TOKEN)"
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error title=Surge deploy failed::SURGE_TOKEN is missing/empty in .env; refusing to deploy."
            exit 1
          fi
          export SURGE_TOKEN

          echo "Publishing the repo root ('.') to $SURGE_DOMAIN"
          surge . "$SURGE_DOMAIN"
          echo "::notice title=Surge deploy::Published the repo root to https://$SURGE_DOMAIN"
